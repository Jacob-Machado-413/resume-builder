services:
  resume-builder:
    build: .
    image: resume-builder
    restart: unless-stopped
    ports:
      - "5180:5180"
    environment:
      # Host names the app answers to; anything else gets a 400 (DNS-rebinding protection).
      AllowedHosts: "phyllistine-server.local;localhost"
    volumes:
      # Database, generated PDFs, photo uploads and the preview cache.
      - resume-data:/data

volumes:
  resume-data:
